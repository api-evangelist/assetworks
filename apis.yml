aid: assetworks

name: AssetWorks

description: >-
  AssetWorks is an enterprise fleet and asset management software company with more than 40 years
  of history and over 1,000 customers across commercial and private fleets, government and public
  works, and higher education. Its products include FleetFocus fleet and enterprise asset management
  (EAM), Active Assets fixed-asset tracking, Recoup Ops surplus management, and Scan and Validate
  mobile inventory management. AssetWorks sells on-premise and hosted enterprise software to large
  fleet and facility operators; as of this profile it publishes no public developer portal, API
  documentation, or self-serve API program. This repo is a company profile in the API Evangelist
  network, backed by Battery Ventures.

